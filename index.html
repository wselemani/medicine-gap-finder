<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medicine Access Gap Finder - Malawi</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; font-family: Arial, sans-serif; display: flex; height: 100vh; height: 100dvh; }
  #side { width: 360px; overflow: auto; padding: 12px; box-sizing: border-box; background: #f7f7f7; }
  #map { flex: 1; min-height: 0; min-width: 0; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { font-size: 12px; color: #555; margin-bottom: 10px; }
  label { display: block; font-size: 12px; margin: 8px 0 2px; font-weight: bold; }
  input, select, button { font-size: 16px; }
  input, select { width: 100%; padding: 6px; box-sizing: border-box; }
  button { width: 100%; padding: 8px; margin-top: 6px; background: #1e6f4f; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  button:disabled { background: #999; cursor: wait; }
  button.secondary { background: #fff; color: #1e6f4f; border: 1px solid #1e6f4f; font-size: 14px; }
  .box { background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 10px; margin-bottom: 12px; }
  #result { font-size: 13px; margin-top: 8px; line-height: 1.5; }
  .good { color: #1e8449; font-weight: bold; }
  .limited { color: #b9770e; font-weight: bold; }
  .bad { color: #c0392b; font-weight: bold; }
  .note { font-size: 11px; color: #666; margin-top: 6px; }
  #count { margin: 10px 0 6px; font-weight: bold; }
  .item { padding: 6px 4px; border-bottom: 1px solid #ddd; font-size: 13px; cursor: pointer; }
  .item:hover { background: #e8f0fe; }
  #error { display: none; background: #fdecea; color: #922; padding: 8px; margin-bottom: 8px; border-radius: 4px; font-size: 13px; }
  #source { font-size: 11px; color: #666; margin-top: 10px; }
  #served { display: none; background: #e8f5e9; color: #1e6f4f; padding: 6px 8px; margin-bottom: 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
  .legend { background: #fff; padding: 8px 10px; border-radius: 6px; font-size: 12px; line-height: 1.7; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  @media (max-width: 700px) {
    body { flex-direction: column-reverse; }
    #side { width: 100%; height: 55%; flex: none; }
    #map { flex: 1; }
  }
  </style>
</head>
<body>
<div id="side">
  <h1>Medicine Access Gap Finder</h1>
  <div class="sub">How far are people in Malawi from a clinic, hospital or pharmacy?</div>
  <div id="served"></div>
  <div id="error"></div>

  <div class="box">
    <label for="place" style="margin-top:0">Check access near a place</label>
    <input id="place" type="text" placeholder="e.g. Chipoka, Mzuzu, Nkhotakota">
    <button id="go" type="button">Check access</button>
    <div id="result"></div>
  </div>

  <button id="reset" class="secondary" type="button">Show all of Malawi</button>

  <label for="q">Search facilities by name</label>
  <input id="q" type="text" placeholder="e.g. Kamuzu">

  <label for="g">Type</label>
  <select id="g">
    <option value="">All types</option>
    <option>Hospital</option>
    <option>Clinic / health post</option>
    <option>Pharmacy</option>
    <option>Other</option>
  </select>

  <label for="r">Region</label>
  <select id="r"><option value="">All regions</option></select>

  <label for="d">District</label>
  <select id="d"><option value="">All districts</option></select>

  <label for="s">Sort by</label>
  <select id="s">
    <option value="name">Name (A to Z)</option>
    <option value="district">District (A to Z)</option>
    <option value="distance" disabled>Closest to my place (check a place first)</option>
  </select>

  <div id="count"></div>
  <div id="list"></div>
  <div id="source"></div>
</div>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const COLORS = { "Hospital": "#c0392b", "Clinic / health post": "#2471a3", "Pharmacy": "#1e8449", "Other": "#7f8c8d" };
const el = {};
["q", "g", "r", "d", "s", "count", "list", "error", "source", "place", "go", "result", "served", "reset"].forEach(id => el[id] = document.getElementById(id));
let all = [], map, layer, hereLayer, here = null, malawiBounds = null;

function group(t) {
  if (t === "hospital") return "Hospital";
  if (t === "pharmacy") return "Pharmacy";
  if (["clinic", "doctors", "health_post", "centre", "yes"].includes(t)) return "Clinic / health post";
  return "Other";
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function showError(msg) {
  el.error.style.display = "block";
  el.error.textContent = msg;
}

function distKm(lat1, lon1, lat2, lon2) {
  const R = 6371, rad = x => x * Math.PI / 180;
  const dLat = rad(lat2 - lat1), dLon = rad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function showMalawi() {
  map.invalidateSize();
  if (malawiBounds) map.fitBounds(malawiBounds, { padding: [20, 20] });
  else map.setView([-13.5, 34.3], 6);
}

function fillRegions() {
  const regions = [...new Set(all.map(f => f.region))].sort();
  regions.forEach(r => el.r.add(new Option(r, r)));
  fillDistricts();
}

function fillDistricts() {
  const keep = el.d.value;
  const pool = all.filter(f => !el.r.value || f.region === el.r.value);
  const districts = [...new Set(pool.map(f => f.district))].sort();
  el.d.length = 1;
  districts.forEach(d => el.d.add(new Option(d, d)));
  if (districts.includes(keep)) el.d.value = keep;
}

function render() {
  const q = el.q.value.trim().toLowerCase();
  const list = all.filter(f =>
    (!q || f.name.toLowerCase().includes(q)) &&
    (!el.g.value || f.group === el.g.value) &&
    (!el.r.value || f.region === el.r.value) &&
    (!el.d.value || f.district === el.d.value)
  );
  if (el.s.value === "distance" && here) {
    list.sort((a, b) => a.km - b.km);
  } else if (el.s.value === "district") {
    list.sort((a, b) => a.district.localeCompare(b.district) || a.name.localeCompare(b.name));
  } else {
    list.sort((a, b) => a.name.localeCompare(b.name));
  }

  layer.clearLayers();
  list.forEach(f => {
    L.circleMarker([f.lat, f.lon], { radius: 6, color: "#ffffff", weight: 1, fillColor: COLORS[f.group], fillOpacity: 0.9 })
      .bindPopup("<b>" + esc(f.name) + "</b><br>" + esc(f.group) + "<br>" + esc(f.district) + ", " + esc(f.region))
      .addTo(layer);
  });

  el.count.textContent = list.length + " of " + all.length + " facilities shown";
  el.list.innerHTML = "";
  if (!list.length) {
    el.list.textContent = "No facilities match these filters. Try clearing one.";
    return;
  }
  list.slice(0, 100).forEach(f => {
    const div = document.createElement("div");
    div.className = "item";
    let text = f.name + " - " + f.group + ", " + f.district;
    if (here && f.km !== undefined) text += " - " + f.km.toFixed(1) + " km away";
    div.textContent = text;
    div.onclick = () => map.flyTo([f.lat, f.lon], 14);
    el.list.appendChild(div);
  });
  if (list.length > 100) {
    const more = document.createElement("div");
    more.className = "item";
    more.textContent = "Showing the first 100. Use the filters to narrow down.";
    el.list.appendChild(more);
  }
}

function nearest(groupName) {
  let best = null;
  all.forEach(f => {
    if (f.group === groupName && (!best || f.km < best.km)) best = f;
  });
  return best;
}

function showGap() {
  all.forEach(f => { f.km = distKm(here.lat, here.lon, f.lat, f.lon); });
  hereLayer.clearLayers();
  L.marker([here.lat, here.lon]).bindPopup("<b>" + esc(here.name) + "</b>").addTo(hereLayer);

  const rows = [];
  const pts = [[here.lat, here.lon]];
  [["Hospital", "Nearest hospital"], ["Clinic / health post", "Nearest clinic / health post"], ["Pharmacy", "Nearest pharmacy"]].forEach(([g, label]) => {
    const f = nearest(g);
    if (f) {
      rows.push(label + ": <b>" + esc(f.name) + "</b> (" + f.km.toFixed(1) + " km)");
      L.polyline([[here.lat, here.lon], [f.lat, f.lon]], { color: COLORS[g], weight: 3, dashArray: "6 6" }).addTo(hereLayer);
      pts.push([f.lat, f.lon]);
    } else {
      rows.push(label + ": none listed");
    }
  });

  const care = Math.min(...all.filter(f => f.group === "Hospital" || f.group === "Clinic / health post").map(f => f.km));
  const pharm = nearest("Pharmacy");
  let verdict;
  if (care <= 5) verdict = '<span class="good">Good access:</span> a listed clinic or hospital is within 5 km.';
  else if (care <= 10) verdict = '<span class="limited">Limited access:</span> the nearest listed clinic or hospital is 5 to 10 km away.';
  else verdict = '<span class="bad">Underserved:</span> no listed clinic or hospital within 10 km.';
  if (pharm && pharm.km > 10) verdict += '<br>No listed pharmacy within 10 km, so people may be unable to buy medicine that the hospital does not have.';

  el.result.innerHTML = "<b>" + esc(here.name) + "</b><br>" + rows.join("<br>") + "<br>" + verdict +
    '<div class="note">Straight-line distance; real walking is longer. Facilities missing from OpenStreetMap are not counted.</div>';

  el.s.querySelector('option[value="distance"]').disabled = false;
  el.s.value = "distance";
  map.fitBounds(pts, { padding: [40, 40], maxZoom: 13 });
  render();
}

async function checkPlace() {
  const name = el.place.value.trim();
  if (!name) { el.result.textContent = "Type a place name first."; return; }
  if (!all.length) { el.result.textContent = "Facility data is not loaded yet."; return; }
  el.go.disabled = true;
  el.result.textContent = "Searching...";
  try {
    const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=mw&q=" + encodeURIComponent(name);
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const rows = await res.json();
    if (!rows.length) {
      el.result.textContent = "Place not found in Malawi. Check the spelling or try a nearby town.";
    } else {
      here = { lat: parseFloat(rows[0].lat), lon: parseFloat(rows[0].lon), name: rows[0].display_name.split(",")[0] };
      showGap();
    }
  } catch (e) {
    el.result.textContent = "The place search is not available right now (" + e.message + "). Check your internet connection and try again in a moment.";
  } finally {
    el.go.disabled = false;
  }
}

async function init() {
  map = L.map("map", { minZoom: 5 }).setView([-13.5, 34.3], 6);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);
  layer = L.layerGroup().addTo(map);
  hereLayer = L.layerGroup().addTo(map);

  const legend = L.control({ position: "bottomright" });
  legend.onAdd = function () {
    const div = L.DomUtil.create("div", "legend");
    div.innerHTML = Object.keys(COLORS).map(k => '<div><span class="dot" style="background:' + COLORS[k] + '"></span>' + k + "</div>").join("");
    return div;
  };
  legend.addTo(map);

  try {
    const res = await fetch("data.json", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const served = res.headers.get("X-Served-By");
    const data = await res.json();
    all = data.facilities.map(f => ({ ...f, group: group(f.type) }));
    if (!all.length) throw new Error("No facilities in data file");
    el.source.textContent = "Data: " + data.source + " (built " + data.built + "). Place search: Nominatim / OpenStreetMap.";
    if (served) {
      el.served.style.display = "block";
      el.served.textContent = "Served by: " + served;
    }
    const inMalawi = all.filter(f => f.lat > -17.5 && f.lat < -9 && f.lon > 32.5 && f.lon < 36.2);
    if (inMalawi.length) malawiBounds = L.latLngBounds(inMalawi.map(f => [f.lat, f.lon]));
    fillRegions();
    render();
    showMalawi();
  } catch (e) {
    showError("Could not load the facility data (" + e.message + "). Please refresh the page or try again later.");
  }
}

el.q.addEventListener("input", render);
el.g.addEventListener("change", render);
el.s.addEventListener("change", render);
el.d.addEventListener("change", render);
el.r.addEventListener("change", () => { fillDistricts(); render(); });
el.go.addEventListener("click", checkPlace);
el.reset.addEventListener("click", showMalawi);
el.place.addEventListener("keydown", e => { if (e.key === "Enter") checkPlace(); });
window.addEventListener("resize", () => { if (map) map.invalidateSize(); });
init();
</script>
</body>
</html>
